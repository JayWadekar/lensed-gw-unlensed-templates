# Conda environment in which every result in data/ was produced.
#   conda env create -f environment.yml && conda activate lensing
#   pip install -e .
# GLoW is not on PyPI or conda-forge; see "Installing GLoW" in README.md.
name: lensing
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.3.4
  - scipy=1.16.2
  - matplotlib=3.10.7
  - mpmath=1.3.0
  - numba=0.62.1
  - h5py=3.15.1
  - astropy=7.1.1
  - lalsuite=7.26
  - gsl            # needed to build GLoW
  - pytest=8.4.2
  - pip
  - pip:
      - pycbc==2.10.0
